# dashboard — local service portal (muxd.local).
name: dashboard
services:
  dashboard:
    image: nginx:alpine
    platform: linux/arm64
    container_name: dashboard
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    ports:
      - "8888:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
    logging:
      driver: "k8s-file"
      options:
        max-size: "5m"
        max-file: "2"
