# gogs — lightweight git hosting (muxd1.com).
name: gogs
services:
  gogs:
    image: gogs/gogs:0.13
    platform: linux/arm64
    container_name: gogs
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    ports:
      - "3000:3000"
    environment:
      GOGS__repository__ROOT_URL: "${GOGS_ROOT_URL:-http://muxd1.com:3000/}"
      GOGS__security__INSTALL_LOCK: "false"
    volumes:
      - ./data:/data
    logging:
      driver: "k8s-file"
      options:
        max-size: "5m"
        max-file: "2"
